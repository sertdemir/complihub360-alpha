# CompliHub360 staging nginx (VPS: /docker/complihub/nginx.conf, mounted RO into nginx:1.27-alpine).
# Deploy: scp infra/staging/nginx.conf root@76.13.159.221:/docker/complihub/nginx.conf
#         && docker compose exec -T web nginx -t && docker compose exec -T web nginx -s reload
# index.html + /locales/ = no-cache (sonst zeigt eine gecachte index.html nach
# einem --delete-Deploy auf geloeschte Asset-Hashes -> 404 -> kaputte Seite).

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Traefik terminiert TLS und reicht intern HTTP weiter — nginx kennt das
  # urspruengliche Schema nicht und baut absolute Redirects als
  # http://host/... . Ein Crawler bekaeme damit bei JEDER Weiterleitung einen
  # Protokoll-Rueckschritt plus einen zusaetzlichen Sprung. Relative Location-
  # Header ueberlassen das Schema dem Client, der bereits auf https ist.
  # Betrifft beides: die 301er unten UND die Schraegstrich-Ergaenzung, die
  # try_files fuer die vom Build erzeugten Routen-Verzeichnisse ausloest.
  absolute_redirect off;

  # Staging must never be indexed, even if a crawler gets past the proxy auth.
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

  # Zurueckgezogene URLs: serverseitig 301, nicht per Client-Redirect. Ein
  # Crawler, der 200 auf /de/countries bekommt, indexiert eine Seite, die es
  # nicht mehr gibt, und verteilt das Ranking auf zwei Adressen.
  #   /countries  -> 2026-08-18 in /markets zusammengefuehrt
  #   /services /advisory /providers -> 2026-08-18 ersatzlos entfernt
  location ~ ^/(en|de|es|tr)/countries/?$ { return 301 /$1/markets; }
  location ~ ^/(en|de|es|tr)/(services|advisory|providers)/?$ { return 301 /$1/; }

  # SPA fallback: client-side router owns all paths.
  # $uri/ kommt VOR dem Fallback, damit die vom Build erzeugten Routen-HTMLs
  # (dist/<locale>/<pfad>/index.html, siehe vite-plugin-seo) mit ihrem eigenen
  # Titel, Canonical und lang-Attribut ausgeliefert werden statt der leeren
  # Huelle. Ohne sie greift wie bisher /index.html.
  location / {
    try_files $uri $uri/ /index.html;

    # Die Routen-HTMLs sind der eigentliche Einstiegspunkt dieser Seiten, nicht
    # /index.html — und sie tragen dieselben gehashten Asset-Namen. Ohne diesen
    # Header cachet der Browser sie heuristisch (Anteil des Last-Modified-
    # Alters), und nach dem naechsten "rsync --delete" zeigt eine gecachte
    # /en/compliance/tax-vat/index.html auf Chunks, die es nicht mehr gibt:
    # die Seite laedt halb und ganze Sektionen fehlen. Genau die Begruendung,
    # die unten an /index.html steht — nur greift "location =" dort exakt und
    # damit an den Routen-HTMLs vorbei.
    add_header Cache-Control "no-cache, must-revalidate";
    # add_header vererbt sich NICHT, sobald ein Block eigene Header setzt. Ohne
    # diese Zeile verloere ausgerechnet jede HTML-Seite das noindex.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  }

  # Content-hashed bundles never change under their name → cache hard.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # The entry point + the (non-hashed) locale files must ALWAYS be
  # revalidated — otherwise a stale index.html points at deleted asset
  # hashes after a --delete deploy and the app breaks (unstyled/blank).
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }
  location = /build-info.json {
    add_header Cache-Control "no-cache, must-revalidate";
  }
  location /locales/ {
    add_header Cache-Control "no-cache, must-revalidate";
  }
}
