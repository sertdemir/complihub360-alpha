<!--
  CompliHub icon gold standard — 6 canonical glyphs at the 24-grid.
  Each is a reusable <symbol viewBox="0 0 24 24">. The <use> grid at the
  bottom is just a preview; the symbols are the artifact to learn from.

  Tokens: gold #B49A5C · soft-gold #C9B583 · ink #1C2433 · cream #EFEBE1
  Every stroke: round caps + joins, fill="none". Curves over corners.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210">

  <!-- 1. shield-check · DUOTONE · soft Q-curve crown, C-curve flanks -->
  <symbol id="ic-shield-check" viewBox="0 0 24 24">
    <path d="M6.8 6 Q12 3.4 17.2 6 C18 11.6 16.2 16.4 12 20 C7.8 16.4 6 11.6 6.8 6 Z" fill="#B49A5C"/>
    <path d="M9 12 L11.3 14.3 L15.3 9.4" fill="none" stroke="#1C2433" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- 2. chat · DUOTONE · rounded bubble + tail, ink text lines -->
  <symbol id="ic-chat" viewBox="0 0 24 24">
    <path d="M8 5 H16 C17.1 5 18 5.9 18 7 V13 C18 14.1 17.1 15 16 15 H11 L8 18 V15 C6.9 15 6 14.1 6 13 V7 C6 5.9 6.9 5 8 5 Z" fill="#B49A5C"/>
    <path d="M9 8.5 H15" fill="none" stroke="#1C2433" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M9 11.5 H13" fill="none" stroke="#1C2433" stroke-width="1.4" stroke-linecap="round"/>
  </symbol>

  <!-- 3. leaf · MONO-feel · pure C-curves, soft-gold mass + ink vein -->
  <symbol id="ic-leaf" viewBox="0 0 24 24">
    <path d="M6 18 C5.6 12 8.5 8 18 7 C17.4 13 13 17.6 6 18 Z" fill="#C9B583"/>
    <path d="M7.5 16 C11 13 14.5 10.5 16.5 8" fill="none" stroke="#1C2433" stroke-width="1.2" stroke-linecap="round"/>
  </symbol>

  <!-- 4. people · DUOTONE · two busts, gold back + ink front (training ref) -->
  <symbol id="ic-people" viewBox="0 0 24 24">
    <circle cx="14.6" cy="8.6" r="2" fill="#B49A5C"/>
    <path d="M11.6 15 C11.6 12.6 12.9 11.3 14.6 11.3 C16.3 11.3 17.6 12.6 17.6 15 Z" fill="#B49A5C"/>
    <circle cx="9.4" cy="9.1" r="2.4" fill="#1C2433"/>
    <path d="M6 16 C6 13.1 7.6 11.7 9.4 11.7 C11.2 11.7 13 13.1 13 16 Z" fill="#1C2433"/>
  </symbol>

  <!-- 5. document · DUOTONE · rounded body (C-corners), ink fold + lines -->
  <symbol id="ic-document" viewBox="0 0 24 24">
    <path d="M8 3.5 H14 L17 6.5 V19.5 C17 20.1 16.6 20.5 16 20.5 H8 C7.4 20.5 7 20.1 7 19.5 V4.5 C7 3.9 7.4 3.5 8 3.5 Z" fill="#B49A5C"/>
    <path d="M14 3.5 V6 C14 6.3 14.2 6.5 14.5 6.5 H17 Z" fill="#1C2433"/>
    <path d="M9.2 10.5 H14.8" fill="none" stroke="#1C2433" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M9.2 13 H14.8" fill="none" stroke="#1C2433" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M9.2 15.5 H12.6" fill="none" stroke="#1C2433" stroke-width="1.3" stroke-linecap="round"/>
  </symbol>

  <!-- 6. gauge · DUOTONE · soft-gold arc track, ink value arc + needle -->
  <symbol id="ic-gauge" viewBox="0 0 24 24">
    <path d="M5 16 A7 7 0 0 1 19 16" fill="none" stroke="#C9B583" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M5 16 A7 7 0 0 1 12 9" fill="none" stroke="#1C2433" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M12 16 L15.2 11.5" fill="none" stroke="#1C2433" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="12" cy="16" r="1.4" fill="#1C2433"/>
  </symbol>

  <!-- preview grid on cream chips -->
  <g>
    <rect x="8"   y="8" width="48" height="48" rx="10" fill="#EFEBE1"/>
    <rect x="68"  y="8" width="48" height="48" rx="10" fill="#EFEBE1"/>
    <rect x="128" y="8" width="48" height="48" rx="10" fill="#EFEBE1"/>
    <rect x="188" y="8" width="48" height="48" rx="10" fill="#EFEBE1"/>
    <rect x="248" y="8" width="48" height="48" rx="10" fill="#EFEBE1"/>
    <rect x="308" y="8" width="48" height="48" rx="10" fill="#EFEBE1"/>
    <use href="#ic-shield-check" x="20"  y="20" width="24" height="24"/>
    <use href="#ic-chat"         x="80"  y="20" width="24" height="24"/>
    <use href="#ic-leaf"         x="140" y="20" width="24" height="24"/>
    <use href="#ic-people"       x="200" y="20" width="24" height="24"/>
    <use href="#ic-document"     x="260" y="20" width="24" height="24"/>
    <use href="#ic-gauge"        x="320" y="20" width="24" height="24"/>
  </g>

  <!-- DUOTONE-OUTLINE variants — same geometry, fills swapped for uniform 2px strokes -->
  <symbol id="ic-shield-check-outline" viewBox="0 0 24 24">
    <path d="M6.8 6 Q12 3.4 17.2 6 C18 11.6 16.2 16.4 12 20 C7.8 16.4 6 11.6 6.8 6 Z" fill="none" stroke="#B49A5C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M9 12 L11.3 14.3 L15.3 9.4" fill="none" stroke="#1C2433" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="ic-privacy-audit-outline" viewBox="0 0 24 24">
    <path d="M5.5 6 Q10 3.6 14.5 6 C15.2 11 13.6 14.8 10 17.6 C6.4 14.8 4.8 11 5.5 6 Z" fill="none" stroke="#B49A5C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="16" cy="15.5" r="3.2" fill="none" stroke="#1C2433" stroke-width="2" stroke-linecap="round"/>
    <path d="M14.7 15.5 L15.7 16.5 L17.5 14.4" fill="none" stroke="#1C2433" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18.3 17.8 L20.6 20.1" fill="none" stroke="#1C2433" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <g>
    <rect x="8"  y="78" width="48" height="48" rx="10" fill="#EFEBE1"/>
    <rect x="68" y="78" width="48" height="48" rx="10" fill="#EFEBE1"/>
    <use href="#ic-shield-check-outline"  x="20" y="90" width="24" height="24"/>
    <use href="#ic-privacy-audit-outline" x="80" y="90" width="24" height="24"/>
  </g>
</svg>
