openapi: 3.0.0
info:
  title: CompliHub360 API
  description: API for CompliHub360 platform (Architecture Sync)
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local development server
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /search:
    post:
      summary: Search and Wizard endpoint
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [country, query]
              properties:
                country:
                  type: string
                query:
                  type: string
                structured_answers:
                  type: object
      responses:
        '200':
          description: Results
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Body ist kein JSON (`INVALID_JSON`)
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: >-
            Die Suche ist gescheitert (`INTERNAL`). Die Ursache steht im
            Server-Log unter der Referenz-ID, nicht in der Antwort.
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /engagement:
    post:
      summary: Create an engagement request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_key, message, country]
              properties:
                provider_key:
                  type: string
                message:
                  type: string
                structured_answers:
                  type: object
                country:
                  type: string
      responses:
        '200':
          description: Engagement created

  /engagement/{id}:
    get:
      summary: Get engagement status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Status retrieved

  /provider/magic/{token}:
    get:
      summary: Provider magic link auth
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK

  /provider/confirm:
    post:
      summary: Confirm engagement
      responses:
        '200':
          description: Confirmed

  /provider/reply:
    post:
      summary: Reply to engagement
      responses:
        '200':
          description: Replied

  /provider/decline:
    post:
      summary: Decline engagement
      responses:
        '200':
          description: Declined

  /document/upload:
    post:
      summary: Upload a raw document
      responses:
        '200':
          description: Uploaded

  /document/request-ai:
    post:
      summary: Request AI processing for a document
      responses:
        '200':
          description: Processed

  # ─── Anbieter-Identitaet und Ownership (Phase 0, 2026-09-22) ───────────────
  # Alle Anbieter-eigenen Routen /provider/{key}/(bookings|coverage|profile|
  # invoices|availability|billing-portal|change-email|billing/preview) sind nur
  # fuer Mitglieder des Anbieters (provider_members), Admins und den
  # Server-Key erreichbar. Fremde bekommen 404, damit die Antwort nicht
  # verraet, welche Anbieter-Schluessel existieren.

  /me/provider:
    get:
      summary: Anbieter-Konto des eingeloggten Nutzers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Der Login gehoert zu diesem Anbieter
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider_key: { type: string }
                  role: { type: string, enum: [owner, admin, member] }
                  name: { type: string, nullable: true }
                  lifecycle_status: { type: string, nullable: true }
        '401':
          description: Kein Login
        '404':
          description: Login gehoert zu keinem Anbieter (errorCode NOT_A_PROVIDER)

  /admin/provider/{key}/member:
    post:
      summary: Login mit einem Anbieter verknuepfen (nur Admin oder Server-Key)
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: user_id oder eine eindeutige E-Mail aus public.users
              properties:
                user_id: { type: string, format: uuid }
                email: { type: string, format: email }
      responses:
        '201':
          description: Verknuepft (idempotent fuer dieselbe Kombination)
        '400':
          description: Weder user_id noch bekannte E-Mail
        '403':
          description: Kein Admin
        '404':
          description: Anbieter unbekannt
        '409':
          description: Launch-Grenze verletzt (PROVIDER_HAS_USER oder USER_HAS_PROVIDER)

  /reviews:
    post:
      summary: Bewertung zu einer gehaltenen Buchung abgeben
      description: >
        Nur von Beteiligten der Buchung (Nutzer der Buchung bzw. Mitglied des
        Anbieters), erst nach dem Termin, einmal je Buchung und Seite. Der
        Anbieter wird aus der Buchung gelesen, nie aus dem Body.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [booking_id, rating]
              properties:
                booking_id: { type: string, format: uuid }
                from_role: { type: string, enum: [user, provider], default: user }
                rating: { type: number, minimum: 0, maximum: 5 }
                categories: { type: array, items: { type: string } }
                body: { type: string, maxLength: 2000 }
      responses:
        '201':
          description: Gespeichert
        '400':
          description: booking_id oder rating fehlt
        '404':
          description: Buchung unbekannt oder nicht die eigene
        '409':
          description: Termin noch nicht stattgefunden (BOOKING_NOT_HELD) oder schon bewertet (ALREADY_REVIEWED)

  # ─── Pricing v2 (ADR-0003, 2026-09-22) ─────────────────────────────────────
  # Plaene, Baender und Rabatte kommen aus plan_catalog / lead_band_config /
  # lead_band_rules / lead_fee_eligibility. Nichts davon erreicht /search.

  /provider/{key}/billing/preview:
    get:
      summary: Laufender Abrechnungszyklus des Anbieters (Pricing v2)
      description: >
        Plan, Rabattkontingent (genutzt/offen), Lead-Belastungen des Zyklus aus
        dem Ledger (Standard, Rabatt, Endbetrag), Guthaben, Preisliste.
        Nur fuer Mitglieder des Anbieters, Admin oder Server-Key.
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Vorschau
          content:
            application/json:
              schema:
                type: object
                properties:
                  period: { type: string, example: '2026-09' }
                  currency: { type: string, example: USD }
                  subscription:
                    type: object
                    nullable: true
                    properties:
                      plan_code: { type: string, enum: [essential, growth, global] }
                      label: { type: string }
                      cadence: { type: string, enum: [monthly, annual] }
                      status: { type: string, enum: [active, past_due, cancelled, ended] }
                      current_period_start: { type: string, format: date }
                      current_period_end: { type: string, format: date }
                      monthly_cents: { type: integer }
                      annual_cents: { type: integer, description: zehn Monatspreise }
                      category_allowance: { type: integer, nullable: true, description: 'null = alle' }
                      analytics_level: { type: string, enum: [basic, enhanced, advanced] }
                      api_eligible: { type: boolean }
                  discount:
                    type: object
                    properties:
                      pct: { type: integer }
                      count: { type: integer }
                      used: { type: integer }
                      remaining: { type: integer }
                      cycle_start: { type: string, format: date }
                  leads:
                    type: object
                    properties:
                      count: { type: integer }
                      standard_cents: { type: integer }
                      discount_cents: { type: integer }
                      final_cents: { type: integer }
                  credit_balance_cents: { type: integer }
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        label: { type: string }
                        qty: { type: integer }
                        unit_cents: { type: integer }
                        amount_cents: { type: integer }
                  total_cents: { type: integer }
                  pricing:
                    type: object
                    description: Aktuelle Preisliste (Plaene und Baender), nur zur Anzeige im Dashboard
        '404':
          description: Anbieter unbekannt oder nicht der eigene

  /admin/billing/run:
    post:
      summary: Abo-Rechnungen einer Periode ausstellen (nur Server-Key)
      description: >
        Stellt je aktivem Abo die Abo-Zeile der Periode als Stripe-Rechnung aus
        (monatlich jede Periode, jaehrlich im Jubilaeumsmonat). Leads laufen
        NICHT hier — sie werden je Buchung belastet und stehen im Ledger.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                period: { type: string, pattern: '^\\d{4}-\\d{2}$' }
                dry_run: { type: boolean }
      responses:
        '200':
          description: Ergebnis je Anbieter
        '403':
          description: Kein Server-Key
        '503':
          description: Stripe nicht konfiguriert (ausser dry_run)

components:
  parameters:
    CorrelationId:
      name: x-correlation-id
      in: header
      required: false
      description: >-
        Referenz-ID des Aufrufs, vom Browser je Anfrage erzeugt. Der Server
        uebernimmt sie, wenn sie 8 bis 64 Zeichen aus Buchstaben, Ziffern und
        Bindestrich hat, und erzeugt sonst eine eigene. Unter dieser ID steht
        ein Fehler im Log; die UI zeigt sie unter "Technical details".
      schema:
        type: string
        pattern: '^[A-Za-z0-9-]{8,64}$'
  headers:
    CorrelationId:
      description: Die ID, unter der der Server den Aufruf geloggt hat.
      schema:
        type: string
  schemas:
    ErrorResponse:
      type: object
      required: [errorCode, message, correlationId]
      properties:
        errorCode:
          type: string
          example: INTERNAL
        message:
          type: string
          description: Kurz und ohne interne Details.
        correlationId:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase-Access-Token des Nutzers
