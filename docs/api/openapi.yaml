openapi: 3.0.0
info:
  title: CompliHub360 API
  description: API for CompliHub360 platform (Architecture Sync)
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local development server
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /search:
    post:
      summary: Search and Wizard endpoint
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [country, query]
              properties:
                country:
                  type: string
                query:
                  type: string
                structured_answers:
                  type: object
      responses:
        '200':
          description: Results
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Body ist kein JSON (`INVALID_JSON`)
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: >-
            Die Suche ist gescheitert (`INTERNAL`). Die Ursache steht im
            Server-Log unter der Referenz-ID, nicht in der Antwort.
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /market-requests:
    post:
      summary: Request a market the engine does not cover yet
      description: >-
        Aktion „Request This Market“ des Zustands `marketUnavailable`. Oeffentlich
        (Gast mit `guest_key`) oder mit JWT; die Identitaet kommt nur aus dem
        geprueften JWT, eine `user_id` im Body wird ignoriert. Eine Zeile je
        Anfragendem und Markt, eine Wiederholung aktualisiert sie. Ein Update zur
        Verfuegbarkeit (`notify`) gibt es nur mit Konto; fuer Gaeste wird keine
        E-Mail gespeichert.

        Versand: Sobald die Engine den Markt prueft, schickt der Watcher je
        Zeile mit `notify` genau eine Mail an die bestaetigte Adresse des
        Kontos (aus `auth.users`, erst beim Versand gelesen) und setzt
        `notified_at`.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [market]
              properties:
                market:
                  type: string
                  description: ISO-Laendercode, zwei Buchstaben (Gross-/Kleinschreibung egal)
                  example: BR
                domains:
                  type: array
                  description: Bereichs-Slugs des Wizards; unbekannte werden verworfen
                  items:
                    type: string
                  example: [tax-vat, data-privacy]
                guest_key:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{8,64}$'
                  description: Pflicht ohne JWT
                notify:
                  type: boolean
                  default: false
                  description: Update per Mail, sobald der Markt abgedeckt ist — nur mit Konto
                locale:
                  type: string
                  enum: [en, de, es, tr]
                  description: >-
                    Sprache des Updates (Seiten-Sprache). Regionale Tags wie
                    `de-DE` werden gekuerzt, andere Sprachen verworfen — der
                    Mailer schreibt dann Englisch.
      responses:
        '200':
          description: Anfrage gespeichert (neu oder aktualisiert)
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  market:
                    type: string
                  notify:
                    type: boolean
        '400':
          description: Body kein JSON (`INVALID_JSON`), Markt falsch geformt oder `guest_key` fehlt (`VALIDATION_ERROR`)
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: '`notify` ohne Konto (`NOTIFY_REQUIRES_ACCOUNT`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Der Markt ist bereits abgedeckt (`MARKET_COVERED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Speichern gescheitert (`INTERNAL`); Ursache im Log unter der Referenz-ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /engagement:
    post:
      summary: Create an engagement request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_key, message, country]
              properties:
                provider_key:
                  type: string
                message:
                  type: string
                structured_answers:
                  type: object
                country:
                  type: string
      responses:
        '200':
          description: Engagement created

  /engagement/{id}:
    get:
      summary: Get engagement status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Status retrieved

  /provider/magic/{token}:
    get:
      summary: Provider magic link auth
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK

  /provider/confirm:
    post:
      summary: Confirm engagement
      responses:
        '200':
          description: Confirmed

  /provider/reply:
    post:
      summary: Reply to engagement
      responses:
        '200':
          description: Replied

  /provider/decline:
    post:
      summary: Decline engagement
      responses:
        '200':
          description: Declined

  /document/upload:
    post:
      summary: Upload a raw document
      responses:
        '200':
          description: Uploaded

  /document/request-ai:
    post:
      summary: Request AI processing for a document
      responses:
        '200':
          description: Processed

  # ─── Anbieter-Identitaet und Ownership (Phase 0, 2026-09-22) ───────────────
  # Alle Anbieter-eigenen Routen /provider/{key}/(bookings|coverage|profile|
  # invoices|availability|billing-portal|change-email|billing/preview) sind nur
  # fuer Mitglieder des Anbieters (provider_members), Admins und den
  # Server-Key erreichbar. Fremde bekommen 404, damit die Antwort nicht
  # verraet, welche Anbieter-Schluessel existieren.

  /me/provider:
    get:
      summary: Anbieter-Konto des eingeloggten Nutzers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Der Login gehoert zu diesem Anbieter
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider_key: { type: string }
                  role: { type: string, enum: [owner, admin, member] }
                  name: { type: string, nullable: true }
                  lifecycle_status: { type: string, nullable: true }
        '401':
          description: Kein Login
        '404':
          description: Login gehoert zu keinem Anbieter (errorCode NOT_A_PROVIDER)

  /admin/provider/{key}/member:
    post:
      summary: Login mit einem Anbieter verknuepfen (nur Admin oder Server-Key)
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: user_id oder eine eindeutige E-Mail aus public.users
              properties:
                user_id: { type: string, format: uuid }
                email: { type: string, format: email }
      responses:
        '201':
          description: Verknuepft (idempotent fuer dieselbe Kombination)
        '400':
          description: Weder user_id noch bekannte E-Mail
        '403':
          description: Kein Admin
        '404':
          description: Anbieter unbekannt
        '409':
          description: Launch-Grenze verletzt (PROVIDER_HAS_USER oder USER_HAS_PROVIDER)

  /reviews:
    post:
      summary: Bewertung zu einer gehaltenen Buchung abgeben
      description: >
        Nur von Beteiligten der Buchung (Nutzer der Buchung bzw. Mitglied des
        Anbieters), erst nach dem Termin, einmal je Buchung und Seite. Der
        Anbieter wird aus der Buchung gelesen, nie aus dem Body.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [booking_id, rating]
              properties:
                booking_id: { type: string, format: uuid }
                from_role: { type: string, enum: [user, provider], default: user }
                rating: { type: number, minimum: 0, maximum: 5 }
                categories: { type: array, items: { type: string } }
                body: { type: string, maxLength: 2000 }
      responses:
        '201':
          description: Gespeichert
        '400':
          description: booking_id oder rating fehlt
        '404':
          description: Buchung unbekannt oder nicht die eigene
        '409':
          description: Termin noch nicht stattgefunden (BOOKING_NOT_HELD) oder schon bewertet (ALREADY_REVIEWED)

  # ─── Pricing v2 (ADR-0003, 2026-09-22) ─────────────────────────────────────
  # Plaene, Baender und Rabatte kommen aus plan_catalog / lead_band_config /
  # lead_band_rules / lead_fee_eligibility. Nichts davon erreicht /search.

  /provider/{key}/billing/preview:
    get:
      summary: Laufender Abrechnungszyklus des Anbieters (Pricing v2)
      description: >
        Plan, Rabattkontingent (genutzt/offen), Lead-Belastungen des Zyklus aus
        dem Ledger (Standard, Rabatt, Endbetrag — nur wirksam belastete oder
        gebuehrenfreie Leads), Guthaben, Preisliste, `readiness { ready,
        reasons[], synced_at }` (Phase 4).
        Nur fuer Mitglieder des Anbieters, Admin oder Server-Key.
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Vorschau
          content:
            application/json:
              schema:
                type: object
                properties:
                  period: { type: string, example: '2026-09' }
                  currency: { type: string, example: USD }
                  subscription:
                    type: object
                    nullable: true
                    properties:
                      plan_code: { type: string, enum: [essential, growth, global] }
                      label: { type: string }
                      cadence: { type: string, enum: [monthly, annual] }
                      status: { type: string, enum: [active, past_due, cancelled, ended] }
                      current_period_start: { type: string, format: date }
                      current_period_end: { type: string, format: date }
                      monthly_cents: { type: integer }
                      annual_cents: { type: integer, description: zehn Monatspreise }
                      category_allowance: { type: integer, nullable: true, description: 'null = alle' }
                      analytics_level: { type: string, enum: [basic, enhanced, advanced] }
                      api_eligible: { type: boolean }
                  discount:
                    type: object
                    properties:
                      pct: { type: integer }
                      count: { type: integer }
                      used: { type: integer }
                      remaining: { type: integer }
                      cycle_start: { type: string, format: date }
                  leads:
                    type: object
                    properties:
                      count: { type: integer }
                      standard_cents: { type: integer }
                      discount_cents: { type: integer }
                      final_cents: { type: integer }
                  credit_balance_cents: { type: integer }
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        label: { type: string }
                        qty: { type: integer }
                        unit_cents: { type: integer }
                        amount_cents: { type: integer }
                  total_cents: { type: integer }
                  pricing:
                    type: object
                    description: Aktuelle Preisliste (Plaene und Baender), nur zur Anzeige im Dashboard
        '404':
          description: Anbieter unbekannt oder nicht der eigene

  /provider/{key}/billing/sync:
    post:
      summary: Zahlungsbereitschaft neu berechnen (Phase 4)
      description: >-
        Liest Stripe (Default-Zahlungsmittel, Rechnungsdaten), Abo, Mandat
        (`billing_authorization`), ueberfaellige Rechnungen und die letzte
        gescheiterte Belastung und setzt `billing_ready` mit Gruenden
        (Spec A §21.1 plus `payment_failed`). Laeuft beim Rueckweg aus dem
        Portal (`?from=portal`) und auf Knopfdruck; nie im Buchungspfad.
        Nur fuer Mitglieder des Anbieters, Admin oder Server-Key.
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: key, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: "`{ readiness: { ready, reasons[], synced_at, payment_method, changed } }`" }
        '503': { description: Stripe nicht konfiguriert }

  /provider/{key}/bookings:
    get:
      summary: Bezahlte Leads des Anbieters
      description: >-
        Je Buchung Termin, Status, `user_email`, Nachricht, und seit Phase 4
        `lead { band, standard_fee_cents, discount_pct, discount_sequence,
        final_fee_cents, currency, payment_status, fee_enabled } | null`,
        `user_discount_pct`, `proposal { proposal_issued, discount_shown,
        reported_at } | null`, `acknowledgement_version`, `price_snapshot`.
        Dazu aus der Anfrage des Nutzers an DIESEN Anbieter `user_company`
        (structured_answers.company, sonst null), `category` und `country`
        (roh, das UI uebersetzt). Die Identitaet ist mit der Buchung
        freigegeben (Dossier-Regel); eine Anfrage an einen anderen Anbieter
        fliesst nie ein.
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: key, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: "`{ ok, providerKey, bookings[] }`" }
        '404': { description: Kein Mitglied dieses Anbieters }

  /provider/{key}/bookings/{id}/proposal:
    patch:
      summary: Selbstauskunft zum Nutzerrabatt (Phase 4)
      description: >-
        Spec B "Mandatory user discount": der Anbieter bestaetigt je Lead, ob
        ein Angebot erstellt und der 10 %-Rabatt ausgewiesen wurde. Eine Zeile
        je Buchung, Korrektur per Upsert, Historie im Protokoll.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proposal_issued, discount_shown]
              properties:
                proposal_issued: { type: boolean }
                discount_shown: { type: boolean, description: Nur true, wenn proposal_issued true ist }
                note: { type: string, maxLength: 500 }
      responses:
        '200': { description: "`{ proposal: { proposal_issued, discount_shown, reported_at } }`" }
        '400': { description: Rabatt gezeigt ohne Angebot, oder Felder fehlen }
        '404': { description: Buchung gehoert nicht diesem Anbieter }

  /admin/billing/run:
    post:
      summary: Abo-Rechnungen einer Periode ausstellen (nur Server-Key)
      description: >
        Stellt je aktivem Abo die Abo-Zeile der Periode als Stripe-Rechnung aus
        (monatlich jede Periode, jaehrlich im Jubilaeumsmonat). Leads laufen
        NICHT hier — sie werden je Buchung belastet und stehen im Ledger.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                period: { type: string, pattern: '^\\d{4}-\\d{2}$' }
                dry_run: { type: boolean }
      responses:
        '200':
          description: Ergebnis je Anbieter
        '403':
          description: Kein Server-Key
        '503':
          description: Stripe nicht konfiguriert (ausser dry_run)

  # ─── Phase 2: Onboarding und Verifikation (Anbieterseite) ──────────────────
  # Alle /provider/{key}/…-Routen unten liegen hinter dem Ownership-Guard:
  # Mitglied des Anbieters, Admin-JWT oder Server-Key; Fremde bekommen 404.

  /provider/{key}/application:
    get:
      summary: Dossier des Anbieters (Canvas 1B)
      description: Kapitelstatus (Konto, Rechtsform, Leistungen, Nachweise, Annahmen, Einreichen), Leistungen mit Laenderzeilen, abgeleitete Nachweis-Checkliste, gueltige Annahmen, offene Nachfragen. Ohne Reviewer-Notizen und ohne Abrechnungsinterna.
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: key, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: Dossier }
        '404': { description: Kein Zugriff oder unbekannt }
    patch:
      summary: Kapitel Konto und Rechtsform pflegen
      description: Oeffentliche Felder gehen nach providers, vertrauliche (Rechtsform, Registernummer, Adressen, Vertretung, Versicherung) nach provider_confidential — getrennt gespeichert, getrennt zurueckgegeben.
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: key, in: path, required: true, schema: { type: string } } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                contact_email: { type: string, format: email }
                website_url: { type: string }
                languages: { type: array, items: { type: string } }
                entity_type: { type: string }
                registration_number: { type: string }
                registered_address: { type: string }
                operating_address: { type: string }
                representative_name: { type: string }
                representative_title: { type: string }
                insurance_provider: { type: string }
                insurance_type: { type: string }
                insurance_valid_until: { type: string, format: date }
      responses:
        '200': { description: Aktualisierte Felder }
        '400': { description: Kein gueltiges Feld }
        '409': { description: Konto beendet (ACCOUNT_CLOSED) }

  /provider/{key}/services:
    post:
      summary: Leistung anlegen (Canvas 2B, Stamm)
      description: service_code aus service_categories. Startet in pending_verification. Prueft das Kategorie-Kontingent des Plans (Spec B) — bei Ueberschreitung 422 CATEGORY_ALLOWANCE mit allowance/used/over; ohne Abo keine Sperre (das Gate meldet den fehlenden Plan).
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: key, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_code]
              properties:
                service_code: { type: string, example: tax-vat.returns }
                service_name: { type: string }
                description: { type: string }
                deliverables: { type: array, items: { type: string } }
                exclusions: { type: array, items: { type: string } }
                pricing_model: { type: string, enum: [fixed, hourly, retainer, project, mixed] }
                price_min: { type: number }
                price_max: { type: number }
                currency: { type: string }
                pricing_basis: { type: string }
                response_time_hours: { type: integer }
                completion_days_estimate: { type: integer }
                capacity_status: { type: string, enum: [open, limited, full] }
      responses:
        '201': { description: Leistung angelegt }
        '409': { description: Schon gelistet (SERVICE_EXISTS) }
        '422': { description: UNKNOWN_SERVICE_CODE oder CATEGORY_ALLOWANCE }

  /provider/{key}/services/{id}:
    patch:
      summary: Leistung pflegen
      description: service_code ist fest (422 SERVICE_CODE_FIXED) — Kategoriewechsel heisst stilllegen und neu anlegen. Aenderungen an freigegebenen Leistungen werden protokolliert.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Aktualisiert }
        '404': { description: Unbekannt }
        '409': { description: Stillgelegt (SERVICE_RETIRED) }
    delete:
      summary: Leistung entfernen oder stilllegen
      description: Nie freigegeben → Zeile weg (Coverage kaskadiert). Einmal freigegeben → status retired, die Zeile bleibt (Buchungen zeigen darauf).
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: removed true|false }

  /provider/{key}/services/{id}/coverage:
    put:
      summary: Laender einer Leistung setzen (Canvas 2B, Zeilen)
      description: Neue Laender als pending. Nicht mehr gelistete pending/rejected-Zeilen werden entfernt; freigegebene werden auf suspended gesetzt (zurueckgezogen), nicht geloescht.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                countries:
                  type: array
                  items:
                    oneOf:
                      - { type: string, example: DE }
                      - { type: object, properties: { country_code: { type: string }, jurisdiction_code: { type: string, nullable: true } } }
      responses:
        '200': { description: coverage, added, removed, withdrawn }

  /provider/{key}/evidence/upload-url:
    post:
      summary: Nachweis ankuendigen und signierte Upload-URL holen (Canvas 3A)
      description: Legt provider_evidence an (received, upload_confirmed=false) und liefert eine signierte PUT-URL in den privaten Bucket provider-evidence (zwei Stunden). PDF, PNG, JPEG bis 20 MB. Das Dokument geht Browser → Storage, nie durch die API.
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: key, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [evidence_type, original_name, mime_type, size_bytes]
              properties:
                evidence_type: { type: string, enum: [incorporation, insurance, representative_identity, professional_licence] }
                original_name: { type: string }
                mime_type: { type: string, enum: [application/pdf, image/png, image/jpeg] }
                size_bytes: { type: integer }
                issuing_authority: { type: string }
                identifier: { type: string }
                issue_date: { type: string, format: date }
                expires_at: { type: string, format: date }
                supports_service_codes: { type: array, items: { type: string } }
                supports_countries: { type: array, items: { type: string } }
      responses:
        '201':
          description: evidence_id, file_ref, upload {url, token, method, headers, expiresAt}
        '413': { description: FILE_TOO_LARGE }
        '415': { description: UNSUPPORTED_MEDIA_TYPE }
        '503': { description: STORAGE_UNAVAILABLE — nichts gespeichert }

  /provider/{key}/evidence/{id}/confirm:
    post:
      summary: Upload bestaetigen
      description: Prueft, ob das Objekt im Bucket liegt; setzt upload_confirmed, uebernimmt Groesse und Typ aus dem Storage; erfuellt offene Nachfragen desselben Typs. Waren es die letzten, geht ein Konto in more_info_required zurueck nach under_verification.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: evidence, fulfilled_requests, lifecycle_status }
        '409': { description: UPLOAD_NOT_FOUND oder NOT_A_DOCUMENT }
        '503': { description: STORAGE_UNAVAILABLE }

  /provider/{key}/evidence/registry:
    post:
      summary: Registerabfrage statt Dokument (USt-IdNr. via VIES)
      description: Speichert das Ergebnis als Nachweis mit source registry_check — valid → independently_verified, invalid → rejected, VIES nicht erreichbar → received (der Reviewer entscheidet). Nie wird ein Ausfall als Ablehnung gespeichert.
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: key, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [vat_id], properties: { evidence_type: { type: string, enum: [vat_id] }, vat_id: { type: string } } }
      responses:
        '201': { description: "evidence, vat {status, vat_id, country_code, name, checked_at}" }
        '422': { description: REGISTRY_UNSUPPORTED }

  /provider/{key}/agreements:
    post:
      summary: Annahme eines Dokuments mit Version festhalten (Canvas 4C)
      description: Append-only mit Version, Sprache, Name, Funktion und audit_ref (Request-ID plus IP-Hash). Eine neue Fassung setzt superseded_at auf die alte, loescht sie nicht.
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: key, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agreement_type, version, accepted_by_name]
              properties:
                agreement_type: { type: string, enum: [provider_agreement, privacy_notice, billing_authorization, commercial_terms] }
                version: { type: string }
                language: { type: string, example: de }
                accepted_by_name: { type: string }
                accepted_by_title: { type: string }
      responses:
        '201': { description: Annahme festgehalten }

  /provider/{key}/submit:
    post:
      summary: Antrag einreichen (Canvas 4A)
      description: "Prueft Konto, Rechtsform, mindestens eine Leistung mit einem Land, Registerauszug und Versicherung bestaetigt, USt-ID abgefragt, zwei Annahmen (provider_agreement, privacy_notice). Die billing_authorization gehoert NICHT hierher: sie verlangt das Aktivierungs-Gate, weil sie erst gebraucht wird, bevor Geld fliesst (Canvas 4C, Nutzer-Entscheidung 2026-09-27; weicht bewusst von Spec A §4 ab, das alle drei vor dem Review auffuehrt). Bei Luecken 422 INCOMPLETE mit missing[] — Schluessel je Punkt, nicht nur \"unvollstaendig\". Setzt draft|more_info_required → submitted."
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: key, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: lifecycle_status submitted }
        '409': { description: NOT_SUBMITTABLE (Status erlaubt kein Einreichen) }
        '422': { description: "INCOMPLETE mit missing[] und chapters" }

  /provider/{key}/verification:
    get:
      summary: Verification Center (Canvas 5B)
      description: Lifecycle, Matrix Leistung × Land mit Zellstatus, Checkliste, offene Nachfragen, Entscheidungs-Historie (ohne Reviewer-IDs).
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: key, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: Matrix und Historie }

  # ─── Phase 3: Anonymes Matching (ADR-0004) ───────────────────────────────
  # Alles, was ein Nutzer ueber einen Anbieter sieht, laeuft ueber `public_ref`
  # (zwoelf Hex-Zeichen, zufaellig). `provider_key` steht in keiner dieser
  # Antworten. Die alten Pfade /provider/{key}/(detail|slots|reviews|website)
  # antworten 404.

  /p/{ref}/detail:
    get:
      summary: Anonymes Anbieter-Detail (Stufe 2)
      description: >-
        Felder nach dem Register `provider_field_visibility` (Klasse
        `anonymous`), Freitexte durch das Identitaets-Netz maskiert,
        `specializations` und `markets` aus der View, `rank_basis` mit den
        Fakten hinter der Reihenfolge. Sichtbar ist, wer in
        `matchable_provider_services` steht — nie `partner_status`.
        `bookable_chargeable` sagt, ob gebucht werden kann — dieselbe Quelle wie
        der Buchungspfad (View-Spalte, gepflegt von syncBillingReadiness). Bei
        false zeigt die Oberflaeche KEINEN Buchen-Knopf, statt den Nutzer erst
        beim Absenden mit 409 BILLING_NOT_READY abzuweisen (Nutzer-Entscheidung
        2026-10-01, TKT-PROV-06).
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: ref, in: path, required: true, schema: { $ref: '#/components/schemas/PublicRef' } } ]
      responses:
        '200':
          description: Detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail: { $ref: '#/components/schemas/AnonProviderDetail' }
                  detail_open_charged: { type: boolean }
        '401': { description: Login noetig }
        '404': { description: Unbekannter Ref oder nicht matchbar }

  /p/{ref}/slots:
    get:
      summary: Buchbare Termine eines Anbieters
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: ref, in: path, required: true, schema: { $ref: '#/components/schemas/PublicRef' } } ]
      responses:
        '200': { description: "`{ public_ref, slots[] }`" }
        '404': { description: Unbekannter Ref }

  /p/{ref}/reviews:
    get:
      summary: Bewertungen aus Buchungen, Text durch das Identitaets-Netz
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: ref, in: path, required: true, schema: { $ref: '#/components/schemas/PublicRef' } } ]
      responses:
        '200': { description: "`{ reviews[], summary }`" }
        '404': { description: Unbekannter Ref }

  /p/{ref}/website:
    get:
      summary: Gezaehlter Klick zur Website — nur nach Offenlegung
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: ref, in: path, required: true, schema: { $ref: '#/components/schemas/PublicRef' } } ]
      responses:
        '302': { description: Weiterleitung }
        '403': { description: Ohne Buchung mit Offenlegung }
        '404': { description: Unbekannter Ref oder keine Website }

  /acknowledgement:
    get:
      summary: Bestaetigungstext vor der Buchung (Phase 4)
      description: >-
        Der Text, den der Nutzer mit der Buchung bestaetigt, mit Fassung,
        Sprache, der Liste der geteilten Felder und dem Nutzerrabatt.
        Oeffentlich — er steht ohnehin auf dem Bildschirm. `?lang=de|en|es|tr`,
        Rueckfall Englisch.
      responses:
        '200': { description: "`{ version, language, body, shared_fields[], user_discount: { pct, policy_version, recurring_treatment } | null }`" }
        '503': { description: Keine Fassung konfiguriert (`ACKNOWLEDGEMENT_MISSING`) }

  /scheduling:
    post:
      summary: Termin buchen (bezahlter Lead, Offenlegung nach der Belastung)
      description: >-
        Phase 4 (ADR-0005): Bestaetigung mit Fassung → Preis-Snapshot → Band +
        Rabatt → Belastung der Anbieterkarte (PaymentIntent off-session, synchron)
        → ERST DANN Buchung und Offenlegung. Nimmt `public_ref`, nie
        `provider_key`. Buchbar ist, wer matchbar UND zahlungsbereit ist
        (Spec A §21.1). Die Opportunity fuer das Band kommt aus `session_id`
        (Bereiche und Maerkte der Sitzung) oder aus `area_code`/`countries`,
        immer begrenzt auf das Angebot des Anbieters. Die Antwort traegt weder
        Band noch Gebuehr — das sieht nur der Anbieter.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_ref, slot_start, acknowledgement_version]
              properties:
                public_ref: { $ref: '#/components/schemas/PublicRef' }
                slot_start: { type: string, format: date-time }
                message: { type: string, maxLength: 2000 }
                acknowledgement_version: { type: string, description: Die Fassung aus GET /acknowledgement, die der Nutzer gesehen hat }
                language: { type: string, maxLength: 2 }
                session_id: { type: string, format: uuid, description: Eigene Sitzung; liefert Bereiche und Maerkte fuer das Band }
                area_code: { type: string, description: Bereich, falls keine Sitzung; muss im Angebot des Anbieters sein }
                countries: { type: array, items: { type: string } }
                service_id: { type: string, format: uuid }
      responses:
        '201': { description: "`{ booking: { id, public_ref, slot_start, slot_end, status, acknowledgement_version, shared_fields[], user_discount: { pct, policy_version } | null }, provider_identity: { name, website_url, contact_email } }`" }
        '400': { description: "Eingabe (`VALIDATION_ERROR`) oder Opportunity fehlt (`OPPORTUNITY_REQUIRED`, `AREA_NOT_OFFERED`, `SERVICE_NOT_FOUND`)" }
        '404': { description: Unbekannter Ref, nicht matchbar oder fremde Sitzung }
        '409': { description: "`BILLING_NOT_READY` (nicht zahlungsbereit, nichts versucht) · `ACKNOWLEDGEMENT_OUTDATED` (mit `current_version`) · `SLOT_TAKEN` · `BOOKING_NOT_COMPLETED` (Belastung gescheitert, Grund `provider_billing`, keine Buchung)" }
        '502': { description: Zahlungsdienst nicht erreichbar (`BILLING_ERROR`); keine Buchung, Anbieter unberuehrt }

  /bookings:
    get:
      summary: Termine des Nutzers
      description: >-
        Je Termin `public_ref`, `provider_name` (Klarname erst bei
        `identity_revealed`, sonst "Verified Provider"), `provider_descriptor`
        (Bereiche · Region, englische Taxonomie-Namen), `provider_area_codes`
        (dieselben Bereiche als Codes, das UI uebersetzt sie), `provider_website`
        erst nach Offenlegung.
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: Termine }

  # ─── Phase 2: Review-Arbeitsplatz (Admin-JWT oder Server-Key, sonst 403) ───

  /admin/review/queue:
    get:
      summary: Pruef-Queue (Canvas 6A)
      description: Zeilen fuer Bewerbungen (submitted, more_info_required, under_verification, approved_pending_activation), Reverifizierungen, offene Aenderungsmeldungen und Nachweise, die in 30 Tagen ablaufen. Spalten kind, provider, lifecycle_status, since, due_at, risk (high = regulierter Bereich oder Sperre, medium = Bewerbung/Aenderung, low = Ablauf), detail.
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: "rows[], counts" }
        '403': { description: Kein Admin }

  /admin/review/{key}:
    get:
      summary: Dossier fuer den Reviewer (Canvas 7A)
      description: Alles aus dem Anbieter-Dossier plus provider_confidential, je bestaetigtem Dokument eine signierte Download-URL (zehn Minuten), Registerergebnis (VIES), Gate-Stand, vollstaendiges Protokoll.
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: key, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: Dossier mit gate }
        '403': { description: Kein Admin }
        '404': { description: Unbekannt }

  /admin/review/{key}/gate:
    get:
      summary: Gate-Leiste (Canvas 8A) ohne Aenderung
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: key, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: "gate {ok, missing[], target, approved_cells, total_cells, allowance, billing}. billing {ready, blocks_chargeable_booking[]} wird GEMELDET, nicht gesperrt: §21.1 sperrt die gebuehrenpflichtige Buchung (409 BILLING_NOT_READY an POST /scheduling), nicht die Aktivierung. Kein billing.* in missing[] (Nutzer-Entscheidung 2026-10-01, TKT-PROV-05)." }

  /admin/review/{key}/evidence/{id}:
    post:
      summary: Nachweis entscheiden
      description: result reviewed|independently_verified|rejected|expired; rejected braucht notes. Ein Dokument ohne bestaetigten Upload kann nur abgelehnt werden (409 UPLOAD_NOT_CONFIRMED). Schreibt provider_review_log.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result: { type: string, enum: [reviewed, independently_verified, rejected, expired] }
                notes: { type: string }
                expires_at: { type: string, format: date }
                next_review_at: { type: string, format: date }
                limitations: { type: string }
      responses:
        '200': { description: evidence }

  /admin/review/{key}/coverage/{id}:
    post:
      summary: Zell-Aktion Leistung × Land (Canvas 8A)
      description: approve|limit|reject|pause|request_info|reopen. Alles ausser approve/reopen braucht reason — der Anbieter liest ihn. request_info legt eine provider_evidence_requests-Zeile an und setzt das Konto auf more_info_required. Der Leistungsstatus folgt seinen Zellen (approved / limited / pending_verification). Benachrichtigt den Dashboard-Login des Anbieters.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [approve, limit, reject, pause, request_info, reopen] }
                reason: { type: string }
                limitations: { type: string }
                expires_at: { type: string, format: date }
                next_review_at: { type: string, format: date }
                evidence_type: { type: string, description: nur bei request_info }
      responses:
        '200': { description: coverage, service_status }
        '201': { description: request angelegt (request_info) }
        '400': { description: Grund fehlt }

  /admin/review/{key}/lifecycle:
    post:
      summary: Kontostatus setzen — durch das Gate
      description: to nach REVIEWER_TRANSITIONS (verificationRules.ts); active und limited laufen durch activationGate() — bei Luecken 422 GATE_NOT_MET mit gate.missing[]; active mit offenen Zellen 422 GATE_TARGET_LIMITED. paused, suspended, terminated, more_info_required brauchen reason. Aktivierung benachrichtigt und mailt den Anbieter.
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: key, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [to], properties: { to: { type: string }, reason: { type: string } } }
      responses:
        '200': { description: from, to, gate }
        '409': { description: TRANSITION_NOT_ALLOWED }
        '422': { description: GATE_NOT_MET oder GATE_TARGET_LIMITED }

  /admin/review/{key}/request:
    post:
      summary: Nachweis nachfordern ohne Zellbezug
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: key, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [evidence_type, message], properties: { evidence_type: { type: string }, message: { type: string }, service_id: { type: string, format: uuid }, country_code: { type: string } } }
      responses:
        '201': { description: request, lifecycle_status }

  /admin/review/{key}/request/{id}:
    delete:
      summary: Offene Nachfrage zuruecknehmen (status withdrawn)
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Zurueckgenommen }
        '409': { description: REQUEST_CLOSED }

components:
  parameters:
    CorrelationId:
      name: x-correlation-id
      in: header
      required: false
      description: >-
        Referenz-ID des Aufrufs, vom Browser je Anfrage erzeugt. Der Server
        uebernimmt sie, wenn sie 8 bis 64 Zeichen aus Buchstaben, Ziffern und
        Bindestrich hat, und erzeugt sonst eine eigene. Unter dieser ID steht
        ein Fehler im Log; die UI zeigt sie unter "Technical details".
      schema:
        type: string
        pattern: '^[A-Za-z0-9-]{8,64}$'
  headers:
    CorrelationId:
      description: Die ID, unter der der Server den Aufruf geloggt hat.
      schema:
        type: string
  schemas:
    PublicRef:
      type: string
      pattern: '^[0-9a-f]{12}$'
      description: Opaker Anbieter-Bezeichner (Phase 3). Zufall, nicht aus dem Namen ableitbar.
    RankBasis:
      type: object
      description: Die Fakten hinter der Reihenfolge — keine Gewichte.
      properties:
        verification: { type: string, enum: [independent, reviewed, partial, none] }
        verified_count: { type: integer }
        required_count: { type: integer }
        response_hours: { type: number, nullable: true }
        confirmation_rate: { type: number, nullable: true }
        rating: { type: number, nullable: true, description: Nur aus Buchungen. }
        reviews_count: { type: integer, nullable: true }
    AnonProviderCard:
      type: object
      description: Ein Anbieter in der Ergebnisliste von POST /search (Stufe 1).
      properties:
        public_ref: { $ref: '#/components/schemas/PublicRef' }
        title: { type: string, example: Verified Provider B }
        letter: { type: string, example: B, description: Position in DIESER Liste; nicht ueber Sitzungen stabil. }
        descriptor: { type: string, example: 'Tax and VAT · Norditalien', description: Freigegebene Bereiche und Region — vom System, nie vom Anbieter. }
        area_codes: { type: array, items: { type: string }, example: [tax-vat], description: Die Bereiche der Beschreibung als Codes — das UI zeigt sie in der Sprache des Nutzers. }
        descriptor_region: { type: string, nullable: true, description: Region der Beschreibung (hat den Identitaets-Scan passiert). }
        region: { type: string, nullable: true }
        active_since: { type: integer, nullable: true }
        specializations: { type: array, items: { type: string } }
        languages: { type: array, items: { type: string } }
        rating: { type: number, nullable: true }
        completed_count: { type: integer, nullable: true }
        avg_response_hours: { type: number, nullable: true }
        billing_model: { type: string, enum: [abo, hourly, project, mixed] }
        is_verified: { type: boolean }
        match: { type: integer }
        match_tier: { type: string, enum: [high, strong, moderate] }
        match_basis: { type: object }
        rank_basis: { $ref: '#/components/schemas/RankBasis' }
    AnonProviderDetail:
      allOf:
        - $ref: '#/components/schemas/AnonProviderCard'
        - type: object
          properties:
            markets: { type: array, items: { type: string } }
            services: { type: array, items: { type: string }, nullable: true }
            credentials: { type: array, items: { type: string }, nullable: true }
            excluded_services: { type: array, items: { type: string }, nullable: true }
            work_mode: { type: string, nullable: true }
            pricing_table: { type: array, items: { type: object }, nullable: true }
            availability: { type: string, enum: [available, ooo] }
    IdentityFinding:
      type: object
      description: Ein Fund des Identitaets-Scans in einem Freitext (422 `IDENTITY_IN_TEXT`).
      properties:
        field: { type: string, example: 'services[1]' }
        type: { type: string, enum: [email, phone, domain, handle, legal_form, registry, own_name] }
        match: { type: string }
        index: { type: integer }
    ErrorResponse:
      type: object
      required: [errorCode, message, correlationId]
      properties:
        errorCode:
          type: string
          example: INTERNAL
        message:
          type: string
          description: Kurz und ohne interne Details.
        correlationId:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase-Access-Token des Nutzers
