<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>CompliHub360</title>

    <!-- Bildmarke aus Compass (Figma 712:266). Das SVG bringt seine eigene
         prefers-color-scheme-Regel mit, deshalb genügt eine Datei fuer hell
         und dunkel. Die ICO bleibt als Fallback fuer aeltere Browser aus. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Theme: apply light/dark before paint to avoid a flash (FOUC). -->
    <script>
        (function () {
            try {
                var k = 'ch360-theme';
                var s = localStorage.getItem(k);
                var dark = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
                var r = document.documentElement;
                if (dark) r.classList.add('dark');
                r.style.colorScheme = dark ? 'dark' : 'light';
            } catch (e) { }
        })();
    </script>

    <!-- Analytics: self-hosted Plausible CE (infra/plausible), cookieless and
         without personal data — the only kind acceptable in front of a
         compliance product. Loads ONLY when both vars are configured; Vite
         leaves the %VITE_…% literal in place when they are not, which the
         charAt check catches, so dev and test stay silent.
         The queue stub must exist before the script so custom events fired
         during startup are not lost. -->
    <script>
        window.plausible = window.plausible || function () {
            (window.plausible.q = window.plausible.q || []).push(arguments);
        };
        (function () {
            var domain = '%VITE_PLAUSIBLE_DOMAIN%';
            var host = '%VITE_PLAUSIBLE_HOST%';
            if (!domain || domain.charAt(0) === '%') return;
            if (!host || host.charAt(0) === '%') return;
            var el = document.createElement('script');
            el.defer = true;
            el.setAttribute('data-domain', domain);
            el.src = host.replace(/\/+$/, '') + '/js/script.js';
            document.head.appendChild(el);
        })();
    </script>

    <!-- Schriften: Inter und IBM Plex Serif kommen seit 23.10.2026 aus dem
         eigenen Build (Fontsource, @import in src/index.css). Kein Preconnect
         und kein Stylesheet von Google mehr; Material Symbols entfielen mit
         dem letzten Verwender (OptionCard, jetzt lucide). -->
    <style>
        body {
            font-family: 'Inter Variable', 'Inter', system-ui, sans-serif;
        }
        html, body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
