<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>CompliHub360</title>

    <!-- Theme: apply light/dark before paint to avoid a flash (FOUC). -->
    <script>
        (function () {
            try {
                var k = 'ch360-theme';
                var s = localStorage.getItem(k);
                var dark = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
                var r = document.documentElement;
                if (dark) r.classList.add('dark');
                r.style.colorScheme = dark ? 'dark' : 'light';
            } catch (e) { }
        })();
    </script>

    <!-- Analytics: self-hosted Plausible CE (infra/plausible), cookieless and
         without personal data — the only kind acceptable in front of a
         compliance product. Loads ONLY when both vars are configured; Vite
         leaves the %VITE_…% literal in place when they are not, which the
         charAt check catches, so dev and test stay silent.
         The queue stub must exist before the script so custom events fired
         during startup are not lost. -->
    <script>
        window.plausible = window.plausible || function () {
            (window.plausible.q = window.plausible.q || []).push(arguments);
        };
        (function () {
            var domain = '%VITE_PLAUSIBLE_DOMAIN%';
            var host = '%VITE_PLAUSIBLE_HOST%';
            if (!domain || domain.charAt(0) === '%') return;
            if (!host || host.charAt(0) === '%') return;
            var el = document.createElement('script');
            el.defer = true;
            el.setAttribute('data-domain', domain);
            el.src = host.replace(/\/+$/, '') + '/js/script.js';
            document.head.appendChild(el);
        })();
    </script>

    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Material Symbols Outlined (variable font, supports FILL axis) -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet" />

    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        html, body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
