<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>CompliHub360</title>

    <!-- Theme: apply light/dark before paint to avoid a flash (FOUC). -->
    <script>
        (function () {
            try {
                var k = 'ch360-theme';
                var s = localStorage.getItem(k);
                var dark = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
                var r = document.documentElement;
                if (dark) r.classList.add('dark');
                r.style.colorScheme = dark ? 'dark' : 'light';
            } catch (e) { }
        })();
    </script>

    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Material Symbols Outlined (variable font, supports FILL axis) -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet" />

    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        html, body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
