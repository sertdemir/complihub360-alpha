# Staging auto-deploy (v1.2) — two SEQUENTIAL jobs against the Hostinger VPS:
#   deploy-api  — esbuild-bundles compliance-api and restarts its container
#   deploy      — builds the vs1-demo UI and rsyncs it, AFTER the API is up
#
# Order matters: the UI may consume payload fields the API only just gained,
# so the API must never lag behind the UI. Running API-first means a partial
# failure can only leave the harmless combination (new API, old UI) — the
# reverse briefly happened on 2026-08-09 and silently degraded the risk map.
# Every SSH/rsync/scp hop is retried 3× because a single transient network
# blip between the runner and Hostinger must not tear a deploy in half.
# Requires one repo secret:
#   VPS_SSH_KEY — private key of the dedicated CI deploy keypair
# (The former STAGING_API_KEY bundle bake was removed with audit P1 #4 —
# the frontend authenticates via user JWT + public guest routes only.)
name: Deploy Staging

on:
  push:
    branches: [main, security/backend-p0-remediation]
    paths:
      - 'apps/vs1-demo/ui/**'
      - 'packages/**'
      - 'services/compliance-api/**'
      - 'services/redaction/**'
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch:

jobs:
  deploy:
    # UI last: guarantees the API is never older than the frontend consuming it.
    needs: deploy-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Build workspace packages (UI imports their dist/)
        # Dependency order matters on a fresh checkout: types is the root of
        # the graph (types → agent-core → registry/policy → orchestrator).
        run: |
          for p in packages/types packages/compliance-engine packages/agent-core \
                   packages/agent-registry packages/policy-engine packages/task-orchestrator \
                   services/redaction; do
            npm run build --workspace "$p" --if-present
          done

      - name: Build frontend
        env:
          # No shared x-api-key in the bundle (audit P1 #4): guests use the
          # public routes, everything else authenticates with the user's JWT.
          # Demo one-click logins therefore see fixture data on staging.
          # Public by design (browser-safe anon key); demo flag keeps the
          # one-click stakeholder logins alongside real auth on staging.
          VITE_SUPABASE_URL: https://kqylqwogxbiwpnomkzsn.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtxeWxxd29neGJpd3Bub21renNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1NDI1MjgsImV4cCI6MjA5OTExODUyOH0.sReK_846Tx-fawVO71Ojy5zJ3uF7Y4xvxGH0Md45Ptk
          VITE_DEMO_LOGIN: '1'
        run: |
          npm run build --workspace apps/vs1-demo/ui
          printf 'User-agent: *\nDisallow: /\n' > apps/vs1-demo/ui/dist/robots.txt
          echo "{\"sha\":\"$GITHUB_SHA\",\"builtAt\":\"$(date -u +%FT%TZ)\"}" > apps/vs1-demo/ui/dist/build-info.json

      - name: Deploy via rsync
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Diagnose without leaking: key fingerprint proves the secret is a
          # valid private key; nc proves port 22 is reachable from GitHub.
          ssh-keygen -lf ~/.ssh/deploy_key || { echo "::error::VPS_SSH_KEY secret is not a valid private key"; exit 1; }
          nc -zv -w 10 76.13.159.221 22 || { echo "::error::Port 22 on the VPS is not reachable from GitHub runners (firewall?)"; exit 1; }
          # keyscan is best-effort; accept-new covers the first connection.
          ssh-keyscan -T 10 -H 76.13.159.221 >> ~/.ssh/known_hosts || true
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          # 3 attempts with backoff — transient runner↔Hostinger timeouts are
          # the single most common deploy failure and are not worth a red run.
          retry() { for a in 1 2 3; do "$@" && return 0; echo "::warning::attempt $a failed, retrying in $((a*10))s"; sleep $((a*10)); done; echo "::error::still failing after 3 attempts"; return 1; }
          retry rsync -az --delete -e "ssh $SSH_OPTS" \
            apps/vs1-demo/ui/dist/ root@76.13.159.221:/docker/complihub/site/
          retry ssh $SSH_OPTS root@76.13.159.221 'chmod -R a+rX /docker/complihub/site'

      - name: Verify
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://staging.complihub360.com/)
          if [ "$code" != "401" ]; then echo "Unexpected status $code" && exit 1; fi
          echo "✓ Staging up (auth wall active)"

  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Bundle API
        # esbuild resolves the workspace packages via their package.json main
        # (dist/), so the dependency graph must be built first — same order as
        # the UI job. The bundle is the exact artifact the container runs.
        run: |
          for p in packages/types packages/compliance-engine packages/agent-core \
                   packages/agent-registry packages/policy-engine packages/task-orchestrator \
                   services/redaction; do
            npm run build --workspace "$p" --if-present
          done
          npx esbuild services/compliance-api/src/index.ts --bundle --platform=node \
            --format=cjs --outfile=/tmp/index.cjs
          echo "{\"sha\":\"$GITHUB_SHA\",\"builtAt\":\"$(date -u +%FT%TZ)\"}" > /tmp/api-build-info.json

      - name: Deploy + restart container
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -H 76.13.159.221 >> ~/.ssh/known_hosts || true
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          retry() { for a in 1 2 3; do "$@" && return 0; echo "::warning::attempt $a failed, retrying in $((a*10))s"; sleep $((a*10)); done; echo "::error::still failing after 3 attempts"; return 1; }
          retry scp $SSH_OPTS /tmp/index.cjs /tmp/api-build-info.json root@76.13.159.221:/docker/complihub-api/app/
          retry ssh $SSH_OPTS root@76.13.159.221 'cd /docker/complihub-api && docker compose restart api'

      - name: Verify health
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          # Poll instead of a single shot after a fixed sleep: a container that
          # is still booting must not read as "broken", and — since the UI job
          # now waits on this one — a flaky check would block the whole deploy.
          # Still fails hard after ~45s, so a genuinely dead API stays red.
          for a in $(seq 1 15); do
            if ssh $SSH_OPTS root@76.13.159.221 \
                 'docker exec complihub-api-api-1 wget -qO- --timeout=5 http://localhost:3005/health' 2>/dev/null | grep -q '"ok":true'; then
              echo "✓ API container healthy on the new bundle (after ${a} attempt(s))"
              exit 0
            fi
            sleep 3
          done
          echo "::error::API did not report healthy within ~45s after the restart"
          ssh $SSH_OPTS root@76.13.159.221 'docker logs --tail 30 complihub-api-api-1' || true
          exit 1
