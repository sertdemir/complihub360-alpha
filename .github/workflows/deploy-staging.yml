# Staging auto-deploy (v2.0) — build on GitHub, install on the VPS itself.
#
#   build-api / build-ui   ubuntu-latest, in parallel, upload an artifact
#   deploy-api             self-hosted runner ON the VPS, installs + restarts
#   deploy-ui              self-hosted runner ON the VPS, AFTER the API is up
#   verify                 ubuntu-latest, checks staging from the outside
#
# Why a self-hosted runner (2026-08-22): the SSH hop from a GitHub runner to
# Hostinger timed out in clusters — 4 of 31 deploys went red while the VPS was
# demonstrably healthy (HTTPS answered in 0.13s, no fail2ban, ufw inactive,
# iptables empty, port 22 reachable from outside GitHub). A runner on the box
# POLLS GitHub over outbound HTTPS, so there is no inbound connection left to
# time out. The retry windows are gone with the SSH hops they guarded.
#
# Order still matters: the UI may consume payload fields the API only just
# gained, so the API must never lag behind the UI. deploy-ui therefore waits on
# deploy-api, and a partial failure can only leave the harmless combination
# (new API, old UI) — the reverse briefly happened on 2026-08-09 and silently
# degraded the risk map.
#
# THE SELF-HOSTED JOBS MUST NEVER CHECK OUT OR EXECUTE REPOSITORY CODE.
# This repository is public, so anyone can open a pull request. The two rules
# that keep a public repo and a self-hosted runner compatible are:
#   1. this workflow runs on `push` to protected branches only — a fork PR
#      cannot trigger it, and forks get no secrets;
#   2. the self-hosted jobs download a built artifact and copy it into place.
#      They run no npm script, no checkout, nothing a contributor authored.
# Both rules are enforced by scripts/check-workflow-runners.mjs in CI. See
# docs/ops/self-hosted-runner.md before changing anything here.
#
# The VPS side (user, sudo wrappers, systemd unit) is installed by
# scripts/vps/install-github-runner.sh. No repository secret is needed any
# more: VPS_SSH_KEY is now used only by the manual scripts/deploy-staging.sh.
name: Deploy Staging

on:
  push:
    branches: [main, security/backend-p0-remediation]
    paths:
      - 'apps/vs1-demo/ui/**'
      - 'packages/**'
      - 'services/compliance-api/**'
      - 'services/redaction/**'
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. Two overlapping runs would race for the same site
# directory, and the single runner would serialize them in an arbitrary order.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # ─── Build (GitHub-hosted; this is where repository code runs) ──────────────

  build-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Bundle API
        # esbuild resolves the workspace packages via their package.json main
        # (dist/), so the dependency graph must be built first — same order as
        # the UI job. The bundle is the exact artifact the container runs.
        run: |
          mkdir -p out
          for p in packages/types packages/compliance-engine packages/agent-core \
                   packages/agent-registry packages/policy-engine packages/task-orchestrator \
                   services/redaction; do
            npm run build --workspace "$p" --if-present
          done
          npx esbuild services/compliance-api/src/index.ts --bundle --platform=node \
            --format=cjs --outfile=out/index.cjs
          echo "{\"sha\":\"$GITHUB_SHA\",\"builtAt\":\"$(date -u +%FT%TZ)\"}" > out/api-build-info.json

      - uses: actions/upload-artifact@v4
        with:
          name: api-bundle
          path: out/
          retention-days: 7
          if-no-files-found: error

  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Build workspace packages (UI imports their dist/)
        # Dependency order matters on a fresh checkout: types is the root of
        # the graph (types → agent-core → registry/policy → orchestrator).
        run: |
          for p in packages/types packages/compliance-engine packages/agent-core \
                   packages/agent-registry packages/policy-engine packages/task-orchestrator \
                   services/redaction; do
            npm run build --workspace "$p" --if-present
          done

      - name: Build frontend
        env:
          # No shared x-api-key in the bundle (audit P1 #4): guests use the
          # public routes, everything else authenticates with the user's JWT.
          # Demo one-click logins therefore see fixture data on staging.
          # Public by design (browser-safe anon key); demo flag keeps the
          # one-click stakeholder logins alongside real auth on staging.
          VITE_SUPABASE_URL: https://kqylqwogxbiwpnomkzsn.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtxeWxxd29neGJpd3Bub21renNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1NDI1MjgsImV4cCI6MjA5OTExODUyOH0.sReK_846Tx-fawVO71Ojy5zJ3uF7Y4xvxGH0Md45Ptk
          VITE_DEMO_LOGIN: '1'
          # Leer, solange die Repository-Variablen nicht gesetzt sind — dann
          # injiziert index.html kein Analytics-Skript. Setzen aktiviert es.
          VITE_PLAUSIBLE_DOMAIN: ${{ vars.PLAUSIBLE_DOMAIN }}
          VITE_PLAUSIBLE_HOST: ${{ vars.PLAUSIBLE_HOST }}
          # Leer => das SEO-Plugin ueberspringt Sitemap, robots.txt und die
          # Routen-HTMLs. Ohne Origin waere jedes Canonical geraten.
          VITE_SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
        run: |
          npm run build --workspace apps/vs1-demo/ui
          printf 'User-agent: *\nDisallow: /\n' > apps/vs1-demo/ui/dist/robots.txt
          echo "{\"sha\":\"$GITHUB_SHA\",\"builtAt\":\"$(date -u +%FT%TZ)\"}" > apps/vs1-demo/ui/dist/build-info.json

      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: apps/vs1-demo/ui/dist/
          retention-days: 7
          if-no-files-found: error

  # ─── Install (self-hosted, on the VPS; NO repository code runs here) ────────

  deploy-api:
    needs: build-api
    runs-on: [self-hosted, complihub-staging]
    timeout-minutes: 10
    steps:
      # The runner is not ephemeral, so the workspace survives between runs and
      # download-artifact only overwrites — a file the previous build produced
      # and this one did not would otherwise be installed as if it were fresh.
      - name: Clear the workspace
        run: rm -rf api-bundle

      # No actions/checkout: see the header. The artifact is the only input.
      - uses: actions/download-artifact@v4
        with:
          name: api-bundle
          path: api-bundle

      - name: Install bundle + restart container
        run: |
          set -euo pipefail
          test -s api-bundle/index.cjs
          install -m 644 api-bundle/index.cjs api-bundle/api-build-info.json \
            /docker/complihub-api/app/
          # docker group membership is root-equivalent, so the runner user has
          # none. It may call exactly three root-owned wrappers via sudo — see
          # scripts/vps/install-github-runner.sh.
          sudo /usr/local/sbin/complihub-api-restart

      - name: Verify health
        run: |
          # Poll instead of a single shot after a fixed sleep: a container that
          # is still booting must not read as "broken", and — since the UI job
          # waits on this one — a flaky check would block the whole deploy.
          # Still fails hard after ~45s, so a genuinely dead API stays red.
          for a in $(seq 1 15); do
            if sudo /usr/local/sbin/complihub-api-health 2>/dev/null | grep -q '"ok":true'; then
              echo "✓ API container healthy on the new bundle (after ${a} attempt(s))"
              exit 0
            fi
            sleep 3
          done
          echo "::error::API did not report healthy within ~45s after the restart"
          sudo /usr/local/sbin/complihub-api-logs || true
          exit 1

  deploy-ui:
    # UI last: guarantees the API is never older than the frontend consuming it.
    needs: [build-ui, deploy-api]
    runs-on: [self-hosted, complihub-staging]
    timeout-minutes: 10
    steps:
      # Same reason as in deploy-api, and it bites harder here: rsync --delete
      # would faithfully install a stale leftover onto the live site.
      - name: Clear the workspace
        run: rm -rf ui-dist

      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui-dist

      - name: Install site
        run: |
          set -euo pipefail
          test -s ui-dist/index.html
          rsync -a --delete ui-dist/ /docker/complihub/site/
          # upload-artifact does not carry permissions, and the container's
          # nginx 403s/500s on directories it cannot traverse.
          chmod -R a+rX /docker/complihub/site

  # ─── Verify (GitHub-hosted: proves the path from outside, not from the box) ─

  verify:
    needs: deploy-ui
    runs-on: ubuntu-latest
    steps:
      - name: Check staging from the public internet
        run: |
          code=$(curl -s --max-time 20 -o /dev/null -w "%{http_code}" https://staging.complihub360.com/)
          if [ "$code" != "401" ]; then echo "Unexpected status $code" && exit 1; fi
          echo "✓ Staging up (auth wall active)"
