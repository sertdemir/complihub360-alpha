name: "CI"

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gates:
    name: "quality-gates"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Check self-hosted runner rules
        # Vor npm ci: der Waechter braucht keine Abhaengigkeiten, und die Regel,
        # die er haelt, ist die teuerste im Repo. Ein self-hosted Runner laeuft
        # auf dem Staging-VPS, und dieses Repository ist oeffentlich.
        run: node scripts/check-workflow-runners.mjs

      - name: Install dependencies
        # npm ci can sometimes be unreliable with complex local workspace linking
        # we fallback to a standard npm install to ensure resilient CI builds.
        run: npm ci || npm install

      - name: Check i18n key parity
        # Reads the locale files only — no DeepL call, so no API key needed.
        run: npm run i18n:check

      - name: Check token export against the shipped CSS
        # tokens.json liest kein Build — genau deshalb kann er still veralten,
        # und genau deshalb steht er hier. Er ist das, was Figma und die Doku
        # als "die Farben" lesen. Keine Abhaengigkeiten noetig.
        run: npm run tokens:check

      - name: Check terminology against the acceptance checklist
        # Die Acceptance-Checklist v1.0 verlangt einen Sprachdatei-Test, der bei
        # verbotenen Begriffen fehlschlaegt. Er prueft alle vier Sprachen und
        # braucht keine Abhaengigkeiten — deshalb steht er hier oben, wo er
        # schnell scheitert.
        run: npm run terminology:check

      - name: Check approved state copy against the acceptance checklist
        # "Use the approved state copy in this document." Die 17 Zustaende und
        # der Sharing-Dialog muessen im Englischen wortgleich zur Vorlage
        # bleiben — eine Umformulierung braucht eine neue Abnahme, nicht nur
        # einen Commit. Ohne Abhaengigkeiten, deshalb ebenfalls hier oben.
        run: npm run copy:check

      - name: Datenbank-Tests (Postgres 16, pgTAP)
        # `supabase/tests/database/` lag seit Monaten im Repo und lief in
        # KEINEM Schritt — drei Dateien, 54 Zusicherungen, nie geprueft. Eine
        # Zusicherung, die nie laeuft, ist eine Notiz.
        #
        # Der Lauf spielt ALLE Migrationen in Reihenfolge ein, nicht einen
        # Schema-Dump: nur so faellt auf, wenn sich der Stand, den Staging
        # faehrt, nicht mehr aus dem Repo herstellen laesst.
        #
        # Kein Service-Container, sondern das auf dem Runner vorinstallierte
        # Postgres 16 — die beiden noetigen Erweiterungen liegen in
        # ubuntu/noble/universe, und ein Service-Container laesst sich
        # nachtraeglich nicht mit Paketen bestuecken.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16-pgtap postgresql-16-pgvector
          sudo systemctl start postgresql@16-main || sudo pg_ctlcluster 16 main start
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          PGHOST=localhost PGPORT=5432 PGUSER=postgres PGPASSWORD=postgres \
            scripts/run-db-tests.sh

      - name: Build Core Dependencies
        run: npm run build:root

      - name: Run Workspace Typechecks
        run: npm run typecheck

      - name: Run Build
        run: npm run build

      - name: Install Playwright Chromium
        # The UI workspace runs its Storybook suite in a real chromium via
        # @vitest/browser-playwright — the runner image has no browsers.
        run: npx playwright install chromium --with-deps
        working-directory: apps/vs1-demo/ui

      - name: Run Tests
        run: npm run test --workspaces --if-present

      - name: Navigation smoke (production build, real chromium)
        # Nach "Run Build", weil der Preview-Server dist/ ausliefert — und das
        # ist der Punkt: zweimal hat ein gruener jsdom-Test behauptet, der
        # Tastaturvertrag von NavMenu halte, waehrend er auf der gebauten Seite
        # nicht hielt. Chromium ist oben schon installiert, der Lauf kostet
        # rund 10 Sekunden. Was er nachweislich faengt und was nicht, steht in
        # playwright.config.ts.
        run: npm run test:e2e
        working-directory: apps/vs1-demo/ui
